<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>멍캠프</title>
  <meta name="description" content="불멍, 물멍, 숲멍. 모닥불과 달빛 바다, 편백 숲 앞에서 잠깐 멍 때리고 가는 작은 힐링 캠프.">
  <meta name="theme-color" content="#0c0e1a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="멍캠프">
  <meta property="og:description" content="잠깐, 멍 때리고 가요. 모닥불, 달빛 바다, 편백 숲.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-log" viewBox="0 0 24 24"><rect x="2.5" y="9" width="15" height="7" rx="3.5"/><ellipse cx="17.6" cy="12.5" rx="2.6" ry="3.5"/><path d="M6 11.6h5M8 14h4"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5s6 6.4 6 10.5a6 6 0 0 1-12 0c0-4.1 6-10.5 6-10.5z"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></symbol>
    <symbol id="i-breath" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5l-7 7 7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 2M9.5 3h5"/></symbol>
  </svg>

  <div id="home">
    <header class="hero">
      <canvas class="hero-canvas" id="heroCanvas" aria-hidden="true"></canvas>
      <div class="hero-inner">
        <p class="eyebrow">멍캠프</p>
        <h1>잠깐,<br>멍 때리고 가요.</h1>
        <div class="hero-actions">
          <a class="btn btn-ember" href="#fire">모닥불 앞에 앉기</a>
          <a class="btn btn-ghost" href="#seats">다른 자리</a>
        </div>
      </div>
    </header>

    <main>
      <section class="band seats" id="seats" aria-labelledby="seats-title">
        <div class="wrap">
          <h2 id="seats-title">어디에 앉을까요?</h2>
          <div class="seat-grid">
            <a class="seat seat-fire" href="#fire">
              <canvas class="seat-thumb" data-scene="fire" aria-hidden="true"></canvas>
              <div class="seat-body"><p class="seat-kicker">불멍</p><h3>모닥불 글램핑</h3></div>
            </a>
            <a class="seat seat-water" href="#water">
              <canvas class="seat-thumb" data-scene="water" aria-hidden="true"></canvas>
              <div class="seat-body"><p class="seat-kicker">물멍</p><h3>달빛 바다</h3></div>
            </a>
            <a class="seat seat-forest" href="#forest">
              <canvas class="seat-thumb" data-scene="forest" aria-hidden="true"></canvas>
              <div class="seat-body"><p class="seat-kicker">숲멍</p><h3>편백 숲</h3></div>
            </a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="session" id="session" hidden>
    <canvas class="stage" id="stage" aria-label="장면"></canvas>
    <div class="curtain" id="curtain" aria-hidden="true"></div>
    <div class="ui" id="ui">
      <div class="topbar">
        <button class="chip chip-icon" id="exitBtn" type="button" aria-label="나가기"><svg class="ico"><use href="#i-back"/></svg></button>
        <div class="top-right">
          <button class="chip" id="timerChip" type="button" aria-label="머무는 시간"><svg class="ico"><use href="#i-timer"/></svg><span id="timerText">20:00</span></button>
          <button class="chip chip-icon" id="fsBtn" type="button" aria-label="전체 화면"><svg class="ico"><use href="#i-full"/></svg></button>
        </div>
      </div>

      <p class="guidance" id="guidance"></p>

      <div class="breath" id="breath" hidden aria-live="polite">
        <div class="breath-ring" data-breath-ring></div>
        <p class="breath-label" data-breath-label></p>
        <p class="breath-count" data-breath-count></p>
      </div>

      <div class="worry-hint" id="worryHint" hidden>
        <p>불 속으로 끌어 넣어요</p>
        <button class="chip" id="worryThrow" type="button">넣기</button>
      </div>

      <p class="toast" id="toast" role="status" aria-live="polite"></p>

      <section class="panel" id="panel-sound" hidden aria-labelledby="panel-sound-title">
        <header class="panel-head"><h3 id="panel-sound-title">소리</h3><button class="panel-close" type="button" data-close aria-label="닫기"><svg class="ico"><use href="#i-close"/></svg></button></header>
        <label class="slider"><span>전체</span><input type="range" id="vol-master" min="0" max="1" step="0.01"></label>
        <div id="layerSliders"></div>
        <button class="chip" id="muteBtn" type="button" aria-pressed="false">끄기</button>
      </section>

      <section class="panel" id="panel-breath" hidden aria-labelledby="panel-breath-title">
        <header class="panel-head"><h3 id="panel-breath-title">호흡</h3><button class="panel-close" type="button" data-close aria-label="닫기"><svg class="ico"><use href="#i-close"/></svg></button></header>
        <div class="seg" id="breathPatterns" role="radiogroup" aria-label="호흡법"></div>
        <label class="check"><input type="checkbox" id="breathCue"> 안내음</label>
        <button class="btn btn-ember btn-block" id="breathToggle" type="button">시작</button>
      </section>

      <section class="panel" id="panel-worry" hidden aria-labelledby="panel-worry-title">
        <header class="panel-head"><h3 id="panel-worry-title">걱정 태우기</h3><button class="panel-close" type="button" data-close aria-label="닫기"><svg class="ico"><use href="#i-close"/></svg></button></header>
        <form id="worryForm" class="worry-form">
          <input id="worryInput" class="text-input" type="text" maxlength="24" autocomplete="off" placeholder="마음에 걸리는 것" aria-label="걱정" required>
          <p class="panel-fine">저장되지 않아요</p>
          <button class="btn btn-ember btn-block" type="submit">장작에 적기</button>
        </form>
      </section>

      <section class="panel" id="panel-timer" hidden aria-labelledby="panel-timer-title">
        <header class="panel-head"><h3 id="panel-timer-title">시간</h3><button class="panel-close" type="button" data-close aria-label="닫기"><svg class="ico"><use href="#i-close"/></svg></button></header>
        <div class="seg" id="timerOptions" role="radiogroup" aria-label="머무는 시간"></div>
      </section>

      <nav class="dock" id="dock" aria-label="장면 조작">
        <div class="dock-scene" id="dockScene"></div>
        <span class="dock-sep" aria-hidden="true"></span>
        <button class="dock-btn" type="button" data-panel="breath" id="breathBtn" aria-pressed="false"><svg class="ico"><use href="#i-breath"/></svg><span>호흡</span></button>
        <button class="dock-btn" type="button" data-panel="sound"><svg class="ico"><use href="#i-sound"/></svg><span>소리</span></button>
        <button class="dock-btn" type="button" id="hideBtn"><svg class="ico"><use href="#i-eye"/></svg><span>숨기기</span></button>
      </nav>
    </div>

    <div class="modal" id="startCard" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <h2 id="start-title"></h2>
        <div class="seg" id="durationOptions" role="radiogroup" aria-label="머무는 시간"></div>
        <button class="btn btn-ember btn-block" id="startBtn" type="button">앉기</button>
        <div class="modal-actions"><button class="link-btn" id="startBack" type="button">돌아가기</button></div>
      </div>
    </div>

    <div class="modal" id="endCard" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="end-title">
        <h2 id="end-title">잘 쉬었어요</h2>
        <div class="modal-buttons">
          <button class="btn btn-ghost" id="stayBtn" type="button">조금 더</button>
          <button class="btn btn-ember" id="leaveBtn" type="button">나가기</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/util.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/scene-fire.js" defer></script>
  <script src="js/scene-water.js" defer></script>
  <script src="js/scene-forest.js" defer></script>
  <script src="js/breath.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
